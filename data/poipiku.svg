<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" id="poipiku">
  <defs>
    <!-- [마스크 정의] 하단 바깥 면에서 글자 모양만 칼로 도려냅니다 -->
    <mask id="poipiku-text-cutout">
      <!-- 배경을 완전한 흰색으로 채움 (흰색 영역은 상자 표면이 남음) -->
      <rect width="512" height="512" fill="#ffffff" />
      <!-- 글자 부분은 완전한 검은색으로 채움 (검은색 영역은 상자 표면이 파여나감) -->
      <g fill="#000000">
        <!-- 'ポ' -->
        <path d="M60 250 L115 235 L115 245 L60 260 Z" />
        <path d="M85 220 L85 330 L75 330 L75 220 Z" />
        <path d="M85 280 L125 290 L122 300 L85 290 Z" />
        <circle cx="120" cy="225" r="10" stroke="#000000" stroke-width="4" fill="none" />
        <!-- 'イ' -->
        <path d="M145 295 L190 260 L196 268 L151 303 Z" />
        <path d="M170 275 L170 345 L160 345 L160 275 Z" />
        <!-- 'ピ' -->
        <path d="M310 270 L310 335 L355 315 L355 250 L345 250 L345 305 L320 315 L320 270 Z" />
        <circle cx="365" cy="235" r="10" stroke="#000000" stroke-width="4" fill="none" />
        <!-- 'ク' -->
        <path d="M390 275 L465 245 L425 325 L415 320 L450 255 L395 285 Z" />
      </g>
    </mask>
  </defs>

  <!-- 1층 (맨 아래): 상자 안쪽을 가로지르는 내부 선들 (뚫린 구멍 뒤로 들여다보일 영역) -->
  <g stroke="currentColor" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <path d="M256 0 L0 128 L256 256 L512 128 Z" />
    <path d="M256 0 L256 256" />
  </g>

  <!-- 2층 (맨 위): 글자 모양대로 뻥 뚫어버린 상자 바깥 표면 레이어 -->
  <g mask="url(#poipiku-text-cutout)">
    <path fill="currentColor" d="M256 512 L0 384 L0 128 L256 256 Z" opacity="0.85" />
    <path fill="currentColor" d="M256 512 L512 384 L512 128 L256 256 Z" />
  </g>
</svg>
