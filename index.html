      <script defer>
       // 음악 제목을 로드하는 함수
       function loadBgmSpans() {
           const bgmTitlesDiv = document.getElementById('bgmTitles');
           fetch('./music.html')
               .then(response => response.text())
               .then(data => {
                   bgmTitlesDiv.innerHTML = data;
               })
               .catch(error => console.error('Error loading music:', error));
       }

       window.addEventListener('load', loadBgmSpans);
      </script>
