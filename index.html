<script src="./skin/js/script.js" defer></script>  
 <script>
<script>
  const cursor = document.querySelector('.custom-cursor');

  window.addEventListener('mousemove', (e) => {
    // 1. 마우스 좌표 실시간 이동 (스크롤바 영역까지 커버)
    cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;

    // 2. 마우스 포인터 바로 밑에 있는 실제 요소 찾아내기
    const target = document.elementFromPoint(e.clientX, e.clientY);
    
    if (target) {
      // 3. 해당 요소에 적용된 CSS의 실제 'cursor' 속성 값 읽어오기
      const computedCursor = window.getComputedStyle(target).cursor;
      
      // 4. 읽어온 값(예: 'pointer', 'text' 등)을 커서의 data-type 속성으로 주입
      // 만약 특별한 값이 없거나 url() 주소 형식이라면 기본값(default)으로 처리
      if (computedCursor && !computedCursor.includes('url(')) {
        cursor.setAttribute('data-type', computedCursor);
      } else {
        cursor.setAttribute('data-type', 'default');
      }
    }
  });

  // 마우스가 브라우저 창 밖으로 완전히 나갔을 때 커서 숨기기
  document.addEventListener('mouseleave', () => {
    cursor.setAttribute('data-type', 'none');
  });
</script>

  </script>
