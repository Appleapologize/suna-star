<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./skin/cs/skin.css">
    <title>사막의 별이 가장 밝게 빛나는 법이지</title>
   <script src="./skin/js/script.js" defer></script>
</head>
<body>
<div class="head">
    <h1 id="head-title">사막의 별이 가장 밝게 빛나는 법이지</h1>
<!-- 모드 변경 버튼 -->
    <button id="theme-toggle-btn" class="theme-icon-button" aria-label="테마 변경">
        <svg xmlns="w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather-sun-moon">
            <!-- 달로 변할 때 파먹는 그림자 마스크 정의 -->
            <mask id="moon-mask">
                <rect x="0" y="0" width="100%" height="100%" fill="white" />
                <circle class="mask-circle" cx="24" cy="4" r="9" fill="black" />
            </mask>
            <!-- 메인 중앙 원 (태양 -> 초승달) -->
            <circle class="main-sun-body" cx="12" cy="12" r="5" fill="currentColor" mask="url(#moon-mask)" />
            <!-- 태양 광선 8개 라인 -->
            <g class="sun-beams" stroke="currentColor">
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </g>
        </svg>
    </button>
</div>
    
<div class="main-wrapper">  
  <aside>
      
  <button id="menu-toggle-btn" class="menu-toggle-btn" onclick="toggleMobileMenu()">
    <div class="hamburger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </button>
  <!-- 모바일에서는 버튼을 누르면 뜨는 메뉴-->
  <div id="mobile-drawer" class="mobile-drawer">
    <!-- ⚠️ <button class="drawer-close-btn">... 항목은 삭제되었습니다. -->
       <!-- 공지 사항 추가-->
              </div>  
</div>

    </div>

</body>
