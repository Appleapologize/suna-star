<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="skin/css/style.css">
    <title>사막의 별이 가장 밝게 빛나는 법이지</title>
   <script src="./skin/js/script.js" defer></script>
</head>
<body>
<div class="head">
    <h1 id="head-title">사막의 별이 가장 밝게 빛나는 법이지</h1>
<!-- 모드 변경 버튼 -->
    <button id="theme-toggle-btn" class="theme-icon-button" aria-label="테마 변경">
        <svg xmlns="w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather-sun-moon">
            <!-- 달로 변할 때 파먹는 그림자 마스크 정의 -->
            <mask id="moon-mask">
                <rect x="0" y="0" width="100%" height="100%" fill="white" />
                <circle class="mask-circle" cx="24" cy="4" r="9" fill="black" />
            </mask>
            <!-- 메인 중앙 원 (태양 -> 초승달) -->
            <circle class="main-sun-body" cx="12" cy="12" r="5" fill="currentColor" mask="url(#moon-mask)" />
            <!-- 태양 광선 8개 라인 -->
            <g class="sun-beams" stroke="currentColor">
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </g>
        </svg>
    </button>
</div>
    
<div class="main-wrapper">  
  <button id="menu-toggle-btn" class="menu-toggle-btn" onclick="toggleMobileMenu()">
    <div class="hamburger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </button>
  <!-- 모바일에서는 버튼을 누르면 뜨는 메뉴-->
  <div id="mobile-drawer" class="mobile-drawer">
      <!-- 1. 메뉴 영역 -->
  <nav>
    <!-- 1. Home -->
    <ul>
      <li>
        <a href="./pages/home.html" class="button" onclick="loadPage(event, './pages/home.html')">Home</a>
      </li>
    </ul>

    <!-- 2. Profile -->
    <ul>
      <li>
        <!-- 💡 수정: 부모 메뉴 클릭 시 home.html이 아닌 서브 메뉴만 열리게 하고 싶다면 주소를 비우거나 수정하세요 -->
        <a href="./pages/home.html" class="button" onclick="loadPage(event, './pages/home.html'); toggleMenu(event, 'sub-profile')">Profile</a>
        <ul id="sub-profile" class="sub">
          <li><a href="./pages/noah-wiki.html" class="btn-sub" onclick="loadPage(event, './pages/noah-wiki.html')">레이</a></li>
          <li><a href="./pages/gaara-wiki.html" class="btn-sub" onclick="loadPage(event, './pages/gaara-wiki.html')">공사중...</a></li>
        </ul>
      </li>
    </ul>

    <!-- 3. 타임라인 -->
    <ul>
      <li>
        <a href="./pages/timeline.html" class="button" onclick="loadPage(event, './pages/timeline.html')">타임라인</a>
      </li>
    </ul>

    <!-- 4. Exhibit. -->
    <ul>
      <li>
        <a href="./pages/home.html" class="button" onclick="loadPage(event, './pages/home.html'); toggleMenu(event, 'sub-exhibit')">Exhibit.</a>
        <ul id="sub-exhibit" class="sub">
          <li><a href="./pages/gallery.html" class="btn-sub button" onclick="loadPage(event, './pages/gallery.html')">갤러리</a></li>
          <li>
            <a href="./pages/sns.html" class="button" onclick="loadPage(event, './pages/sns.html'); toggleMenu(event, 'ssub-sns')">SNS</a>
            <ul id="ssub-sns" class="ssub">
              <li><a href="./pages/sns-lock.html" class="btn-sub-sub" onclick="loadPage(event, './pages/sns-lock.html')">🔒</a></li>
              <!-- 💡 오타 수정: 'talk html' ➡️ './pages/talk.html' -->
              <li><a href="./pages/talk.html" class="btn-sub-sub" onclick="loadPage(event, './pages/talk.html')">TALK</a></li>        
            </ul>
          </li>
          <li><a href="./pages/play-list.html" class="btn-sub button" onclick="loadPage(event, './pages/play-list.html')">PlayList</a></li>      
        </ul>
      </li>
    </ul>

    <!-- 5. Guest -->
    <ul>
      <li>
        <!-- 💡 오타 수정: '게스트' ➡️ './pages/guest.html' -->
        <a href="./pages/guest.html" class="button" onclick="loadPage(event, './pages/guest.html')">Guest</a>
      </li>
    </ul>

    <!-- 6. Banner -->
    <ul>
      <li>
        <!-- 💡 오타 수정: '배너l' ➡️ './pages/links.html' -->
        <a href="./pages/links.html" class="button" onclick="loadPage(event, './pages/links.html')">Banner</a>
      </li>
    </ul>
  </nav>
   </div>  
</div>

    </div>
