                         <p>이 횡단보도만 건너면 집이라서 그런지 더 마음이 급해졌다. 녹색 불이 켜져서</p>             <p>횡단보도를 건너던 중이었는데…. 분명히 그랬는데.........</p>             <p>저기 내 몸이 누워 있는걸 왜 보고 있는 걸까......</p>             <p><br /></p>             <p>"세상에 어떡해. 피 봐"</p>             <p>"아이고 어려 보이는데 우째"</p>             <p>"여보세요 119죠? 지금 여기 사고가 났어요. 예, 아 여기가 어디냐면......"</p>             <p><br /></p>             <p>당황해 하는 사람들이 정신을 차리는 듯하더니 경찰에, 119에 전화하고 있었다. 그리고 저기서 날 보고 우는 할아버지.</p>             <p>돌아가신 할아버지가 보이니 인정하지 않을 수가 없었다. 나 죽었구나…</p>             <p><br /></p>             <p>‘할아버지 죄송해요. 저도 오래 살고 싶었는데.....이렇게 갈 줄은 몰랐어요.....’</p>             <p><br /></p>             <p>내 몸의 주위를 둘러싼 사람들을 구경하고 있었다.</p>             <p>경찰과 119는 생각보다 빨리 왔고 상황은 금방 수습되었다.</p>             <p>내 몸을 따라 구급차에 들어가고, 병실로 옮겨졌다.</p>             <p>아직 미약하게나마 몸은 살겠다고 발버둥 치고 있었다. 그래봤자 내가 여기서 이걸 보고있다는 걸 생각하면 결과는 하나겠지만…</p>             <p><br /></p>             <p>아빠랑 엄마는 언제 올까..... 멀리서 자취하는 오빠도, 부모님과 같이 살고 있었던 남동생도 올까? 어떤 표정일까. 울까??</p>             <p>갑자기 초등학생 때 반 내에서 괴롭힘을 당했을 때가 생각난다.</p>             <p>오빠는 나보다 겨우 2살 많았지만, 그 2살 차이도 크게 생각해 물어본 게 있었다.</p>             <p>내가 죽으면 과연 슬퍼해 줄 것인가.</p>             <p>오빠는 처음에는 안 슬퍼할 거라고 장난스럽게 웃으며 대답했지만, 나중에는 진지하게 대답해줬었지.</p>             <p><br /></p>             <p>"가족인데 어떻게 슬퍼하지 않을 수 있겠어. 온종일 울겠지. 너도 내 동생인데"</p>             <p><br /></p>             <p>그때 이후로 일이 터졌던가?..</p>             <p>무슨 일 때문에 집에 울면서 갔고. 그래서 집에 가서 괴롭힘 당한 일을 전부 말했고, 아빠는 당장 날 괴롭힌 그 녀석을 잡아다가 족치겠다며 분노하셨고, 엄마는 그런 아빠를 말렸고....</p>             <p>그 뒤로 우리 집은 이사 갔다. 아빠의 회사가 옮긴지 1년. 그 동안 이사를 준비했었고 이사하기 일주일 전에 가족들이 그 사실을 안 거였다.</p>             <p>여전히 그 때 왜 괴롭힘을 당한 건지 모르겠지만 그 때문에 이상한 습관이 생겼고 그걸 고치느라 힘들었던 기억이었다.</p>             <p>지금도 완전히 못 고쳤지만, 그래도 어느 정도 고치기는 해서 친구도 사귈 수 있게 되었으니까.</p>             <p>중환자실에서 내 아슬아슬한 심장 박동 소리를 듣고 있다보니 시간이 꽤 지났는지 누군가 들어왔다.</p>             <p><br /></p>             <p>아. 엄마랑 아빠다. 허겁지겁 나에게 온 두 사람은 이게 무슨일이냐면서 나에게 일어나라고 했다. 아빠는 호통까지 치고….</p>             <p>오빠는 동생이랑 같이 올까??</p>             <p>한 시간은 기다려야겠지? 있는 곳이 여기서 머니까.</p>             <p>할아버지는 이미 돌아가신지라 아무 생각도 안 들었는데 두 분은 보니까 눈물이 나왔다.</p>             <p>정말 듣기 싫은 아빠의 호통이 들려도 말이다.</p>             <p>나, 더 오래 같이 있고 싶었는데.....</p>             <p><br /></p>             <p>「 미안해요... 」</p>             <p><br /></p>             <p>다른 사람의 목소리가 들린 것 같았지만 다른 걱정이 있어 무시했다.</p>             <p>이대로 저승사자가 온다면 난 어떻게 해야 하는 걸까. 아직 오빠랑 동생 얼굴을 보지 못했다. 갈 수는 없다. 서쪽으로 삼천리나 되는 먼 길을 떠나게 될 텐데 가족들 얼굴을 보지도 못하고 갈 순 없었다.</p>             <p>이미 지옥에 가는 게 확정이라도, 더한 곳에 간다 해도 얼굴을 보고 가고 싶었다.</p>             <p>또 다시 그 목소리가 들려왔다.</p>             <p><br /></p>             <p>「 미안해.... 」</p><div><hr class="hr hr-solid"></div>             <p>이젠 익숙해진 천장을 보고 있다.</p>             <p>여긴 내 집이 아니다.</p>             <p>우리 가족도 내 친구들도 없는 곳</p>             <p>여긴 내가 좋아하던 만화 속 세상이다.</p>             <p>어떻게 알았냐면 나를 이 마을로 데려온게 내가 제일 좋아하는 캐릭터의 아빠 되는 사람이었으니까.</p>             <p>식사 시간, 지금 얹혀살고 있는 집 안의 아이들이 모두 모이는 유일한 시간.</p>             <p>아이들만 있는데도 식기가 부딪치는 소리만 들린다.</p>             <p>아무도 이야기하지 않는다.</p>             <p><br /></p>             <p>"하아......"</p>             <p>"...."</p>             <p>"....."</p>             <p>"........"</p>             <p><br /></p>             <p>내가 한 숨을 쉬든 말든 다들 식사를 하고있다.</p>             <p>단 한 명이 집 셋째 아들만 나를 흘겨보는 것만 빼고는</p>             <p>내 옆에 앉은 이 붉은 머리 아이가 내가 이 작품에서 가장 좋아하는 캐릭터인 '가아라'</p>             <p>그렇다. 나는 나루토라는 작품을 열심히 보던 중에</p>             <p>본편 시작 6년 전에 그것도 본 무대가 아닌 곳에 누군지 모를 캐릭터에 빙의인지 환생인지를 했다.</p>             <p><br /></p>             <p>가아라의 아빠가 데려왔을 때 대강 짐작했지만, 가아라를 보고 장소를 확신했고, 어느 정도의 시간 이후인지도 알게 됐다.</p>             <p>야샤마루가 사라진 후의 모래 마을이라면….</p>             <p>가아라의 저 독기가 빠지려면 6년을 기다려야 한다는 거다.</p>             <p>이 때의 가아라는 인간혐오가 기본적으로 깔려있는 아이라서 섣부르게 다가갔다가는 내 목숨이 위험할 거다. 그래서 좀 조심해야 하지만….그렇지만...</p>             <p><br /></p>             <p>"......."</p>             <p>"......."</p>             <p><br /></p>             <p>그러기에는 너무 귀엽다.</p>             <p>나랑 눈이 마주치고서 가아라는 아직 앳된 목소리로 (하지만 경계심은 심한 어투로)물었다.</p>             <p><br /></p>             <p>"....지금 뭐 하고 있는 거야"</p>             <p>"너 밥 먹는 거 구경"</p>             <p><br /></p>             <p>앗 눈꼬리 움찔한 걸 보니 좀 화났나?</p>             <p>대답을 하고서 나도 내 식사를 이어갔다. 오늘은 여러 채소를 깍뚝 썰어서 넣은 스튜였다.</p>             <p>원래 채소보다는 고기 파지만 채소도 나쁘진 않다.</p>             <p>게다가 아무리 카제 카게의 집이라지만 이 마을은 사막 중앙에 있어서 살기 좋은 환경이 아니다. 게다가 이집트와 달리 강을 끼고있는 것도 아니다.</p>             <p>즉, 모든 자원이 부족하다는 거다.</p>             <p><br /></p>             <p>그나마 사막이라는 보기 드문 환경을 살려 관광 사업이라도 헤보면 좋겠지만, 지금은 보이지 않는 전쟁  중이라 그것도 어렵겠지. 그래서 현 카제카게인 가아라의 아빠, 라사는 사금을 활용해 경제적으로 부유하게 좀 만들려는 모양인데 재임하는 동안에는 그나마 낫기는 했지만, 그가 세상을 뜨고 나서는 이전 상태가 되었다고 알고 있었다.</p>             <p>참....환경 때문에 해야 할게 한 두가지가 아니구나….</p>             <p><br /></p>             <p>시간이 많이 지났는지 밥을 먹고 있는 건 나뿐이었다.</p>             <p>기다리는 사람이 없으니 천천히 먹어도 되지만 난 혼자 있는게 힘들었다. 그러면 이전 세상의 가족들과 친구들이 아직은 생각났으니까.</p>             <p>내가 이렇게까지 외로움을 잘 타는 인간일 줄은 몰랐는데.....</p>             <p>후다닥 먹고 바로 방으로 돌아갔다.</p>             <p>방에서 무언가라도 하면 그나마 나을 것이다.</p><div><hr class="hr hr-solid"></div>             <p>오늘은 무엇을 할까 하다가 책을 집어 들었다. 숙제용 노트였다.</p>             <p>내가 이곳 글자를 모르는 걸 어떻게 아는지 그 마을 이장은 글자를 배우라며 선생님도 붙여줬다.</p>             <p>가아라와 같이 학교 생활이라는 말에 홀려서 오케이를 했지만, 글을 못 읽는다니... 보통 글자도 언어랑 같이 패치 되지 않나.....</p>             <p><br /></p>             <p>그리고 이 작품은 일본에서 만들었다. 말하는 언어 패치는 되어있어 걱정 없지만, 글자는 한자와 카타카나와 히라가나다. 고등학생 때 제2 외국어로 일본어를 골랐던지라 히라가나나 카타카나는 어느정도 아는데... 한자는 하나도 모른단 말이지...</p>             <p>그래서 숙제도 대부분 한자 외우기다.</p>             <p>책과 노트를 펼쳐 숙제를 하던 중 누군가가 문을 두들겼다.</p>             <p>똑똑.</p>             <p><br /></p>             <p>"누구세요?"</p>             <p>"나야"</p>             <p><br /></p>             <p>목소리를 들어보니 칸쿠로 씨인 것 같았다.</p>             <p>왜 나한테 오지 보통 테마리 씨랑 같이 놀거나 자기 친구들하고 놀지 않나?</p>             <p>뭐 일단 왔으니 그냥 가라 할 수도 없으니 일단 방문을 열었다.</p>             <p><br /></p>             <p>"무슨 일이세요??"</p>             <p>".....아니..... 오늘은 같이 놀자고"</p>             <p>"테마리 씨도 같이요?" </p>             <p>"으음......"</p>             <p><br /></p>             <p>대답을 바로 하지 않는 것을 보니 테마리 씨에게 답을 못 받은 모양이었다.</p>             <p>그 반응에 나는 단호하게 이야기 했다.</p>             <p><br /></p>             <p>"...그럼 안 갈래요. 숙제도 있고요."</p>             <p><br /></p>             <p>어린애 같은 답이지만, 정말 테마리 씨가 같이 안 가면 가기 싫었다. </p>             <p>첫째라서인지 테마리가 조금 남을 챙겨주는 게 있어 적절한 시간에 칸쿠로를 설득해서 집 안으로 들어가기 때문이었다. 테마리 씨가 없으면 뭐 하루는 버릴 각오를 해야 한다는 거다.</p>             <p><br /></p>             <p>"아직 물어보진 않아서...... 물어보고 올게!"</p>             <p>"...그럼 같이 물어보러 가요. 안 된다 하면 제가 방으로 돌아오면 되니까요."</p>             <p>"응!!"</p><div><hr class="hr hr-solid"></div>             <p>우리 셋은 다 같이 밖으로 나왔다.</p>             <p><br /></p>             <p>가지고 온 모래 놀이 도구를 모래 위에 올려두고서 모래 놀이를 하기 시작했다.</p>             <p><br /></p>             <p>'오랜만이네. 초등학교 3학년 때까지는 집 앞 놀이터가 모래 위에 있던지라 자주 하고 놀았는데.'</p>             <p><br /></p>             <p>테마리 씨는 모래로 산을 쌓고 있었고 칸쿠로 씨는 열심히 땅을 파고 있었다.</p>             <p>모래 위에서는 뭐 저게 제일 재밌긴 했다.</p>             <p>땅 파기 특히 남자애들은 누가 더 깊게 파나 내기도 했었고..... 재밌었는데.....</p>             <p><br /></p>             <p>참고로 난 두꺼비 집이나 지어줬었다.</p>             <p>내가 어른이 되고 난 이후로는 안전 문제 때문에 내가 모래를 만지며 놀던 놀이터 전부 다 고무로 된 판으로 변경 되었었다.</p>             <p>아파트와 가까운 곳에는 미끄럼틀이 그 옆에는 모래 놀이를 하기 좋게 빈 곳이었는데........</p>             <p><br /></p>             <p>"레이. 뭐해?"</p>             <p>"아뇨 그냥 추억 회상이요"</p>             <p>"...? 너 가끔 보면 늙은이 같은 말을 할 때가 있다?"</p>             <p><br /></p>             <p>'그야 속 알맹이는 24살이니까요'</p>             <p>대답을 속으로 삼키면서 나온 건물을 올려다보았다.</p>             <p>모래 바람이 많이 불어서 창이 작지만, 흙으로 만든건지 벽은 견고했고 틈 하나 보이지 않았다.</p>             <p>그러고 보니, 우리 집도 이 정도 높이에 있었었나?</p>             <p>그런 생각으로 멍하니 건물을 올려다 보던 중에 창문 앞에서 누군가가 아른거리는게 보였다.</p>             <p>붉은 머리색. 가아라였다.</p>             <p>뭐지? 같이 놀고 싶은 건가?</p>             <p><br /></p>             <p>"레이 누구 있어?"</p>             <p>"어...... 가아라 인것 같아요"</p>             <p><br /></p>             <p>칸쿠로에게 대답하니 좀 밝던 표정이 금방 어두워졌다.</p>             <p><br /></p>             <p>"칸쿠로 씨, 동생인데 표정이 왜 그러신가요?"</p>             <p>"그게........."</p>             <p><br /></p>             <p>카제카게가 뭘 이야기해서 그런지 저렇게 주저하며 대답을 피해버리지만 어떤 일이 일어났는지는 알고 있다.</p>             <p>분명 칸쿠로는 가아라의 첫 폭주 때 마을 사람들이 죽어가는 걸 본 이후로 트라우마가 있었지</p>             <p>며칠간은 밥도 못 먹었으니까.</p>             <p><br /></p>             <p>'저런 게 내 동생일지 없어'</p>             <p><br /></p>             <p>만화로만 봤던 그 대사가 생각났다. 두려움에 떨리던 어린아이의 목소리가 생각났다.</p>             <p>가아라보다 2살 많으니 그때면 겨우 8살이었는데.....</p>             <p>그러고 보니, 테마리 씨는 칸쿠로 씨랑 연년생이라 나이 차이도 별로 안나는데 트라우마가 별로 없는 건가? </p>             <p>아니면 그때 이미 대피소에 있던 거라 잘 모르는 건가?</p>             <p>궁금했지만 지금 내가 본 건 혼자 있는 어린아이였기에 두 사람에게 한 마디를 하고서 건물 안으로 들어갔다.</p>             <p><br /></p>             <p>"같이 놀자고 한 번 이야기해 보고 올게요."</p>             <p><br /></p>             <p>등 뒤에서 말리는 목소리가 들렸지만 알 바 아니다.</p>             <p>난 원래부터 남의 말 안 듣는 사람이었거든.</p>             <p>뭐 이걸로 큰 문제가 생기지는 않을거다…..........맞겠지???</p>             <p>제발 그러기를 바라며 가아라가 보였던 방으로 발걸음을 옮겼다.</p>

            <p><br /></p>
            <p>크지도 작지도 않게 노크를 해본다.</p><p>누구냐는 형식적인 물음도 들려오지 않았다. 그래도 일단 누군지는 밝히는 게 좋을 것 같아서 방문 너머를 향해 외쳤다.</p><p><br /></p><p>"나, 레이야. 같이 놀래?"</p><p><br /></p><p>또 대답이 들려오지 않았다. 사람에 대한 불신이 가득한 이 시기에 몇 번 보지 못한 사람이 부르면 그럴 수도 있…기는 한데… 대답 안하는게 아니라 못 들었나?</p><p><br /></p><p>"같이..."</p><p><br /></p><p>다시 같이 놀자고 이야기 하려는 순간에 갑자기 문이 열려서 놀랐다.</p><p><br /></p><p>문을 따라 뒷걸음질 치고서 볼 수 있었던건 나를 노려보는 가아라였다. </p><p>같은 나이였다면 무서워서 도망쳤겠지만, 나는 야샤마루가 살아있을 적의 가아라도 알고있을 뿐만 아니라, 알맹이는 24살 성인이였기에 그냥 귀여워 보였다.</p><p>나도 모르게 미소가 지어졌다.</p><p><br /></p><p>"놀자"</p><p>"싫어"</p><p>"? 왜?"</p><p>"시끄럽게 하지 말고 가. 아니면 죽일거다."</p><p><br /></p><p>저건 경고였다. 절대로 싫다는 경고</p><p>싫은 사람을 억지로 데려갈 수도 없어서 알겠다고 대답하고서 뒤돌아서 내려갔다.</p><p>내려가던 중에 문득 생각이 들었다.</p><p>나는 분명히 가아라가 창문으로 테마리와 칸쿠로, 그리고 나를 보고있던 걸 목격하고 온 거였다. 같이 놀고 싶었던게 아니라면….왜 우릴 보고 있던 거지?</p><div><hr class="hr hr-solid-bold"></div><p>가아라는 오늘도 기분이 좋지 않았다.</p><p>아니, 원래도 좋았던 적이 없었지만 저 녀석이 온 이후로는 더 좋지 않았다.</p><p>야샤마루 이후로 오던 암살자들은 저 녀석이 마을에 온 날 이후로는 오지 않았다. 괴물을 없애는 것도 꺼려질 만큼 애지중지하는 것 같아서 기분이 좋지 않았다.</p><p><br /></p><p><strong><em>「죽어주세요」</em></strong></p><p><br /></p><p>나는 믿었던 유일한 사람에게도 버림받았는데, 저 녀석은 뭐길래 외부에서 온지 일 년도 되지 않아 이렇게 많은 사람들에게 사랑 받는 것인가.</p><p><br /></p><p><strong><em>「당신은 누구에게도 사랑받지 못했어.」</em></strong></p><p><br /></p><p>몇 달이나 지났건만 녀석이 온 날은 잊히지 않고 생생하다.</p><p><br /></p><p>'노아 레시티이샤'</p><p><br /></p><p>혐오스럽다는 눈으로 날 보는 사람들, 가족들.</p><p>갑자기 오아시스로 간다며 사라진 아버지만 빼면 여느 때와 다름없었다.</p><p>돌아온 아버지가 같이 데리고 온게 레이였다.</p><p>카제카게로서 레이를 신이 내린 아이로 소개하면서. 마을 구성원으로 받아들일 것이며 이는 마을에 큰 도움이 될 것이라 이야기했다.</p><p>나중에 듣기로는 녀석의 주위로는 천천히 물이 모여들고 있었다는 것이다.</p><p>그럼 녀석이 있는 것에서 물에 대한 고민은 조금이지만 해결할 수가 있다고 하는 걸 얼핏 들었다.</p><p>그렇기에 마을 일원으로 받아들이고자 결론이 내려졌고, 카제카게의 이름으로 보호하기로 공문이 내려졌다.</p><p>그렇다고 그것만으로는 모든 사람의 마음을 사로잡을 순 없었을 것이다. 그걸로는…</p><p><br /></p><p>녀석에게 먼저 호감을 표한건 비슷한 나이의 또래들이었다.</p><p>또래들이 먼저 다가갈 정도로 녀석은 객관적으로도 괜찮은 외모를 하고 있었다.</p><p>푸른 하늘의 색을 빼닮은 머리카락. 금색 별처럼 반짝이는 커다란 눈.</p><p>아무리 아이라지만, 외부에서 온 사람이라며 경계하던 어른들도 그 외모를 보고는 감탄을 숨길 수 없었다.</p><p>밖으로 나오기만 하면 모두 말 한마디 붙이고 싶어 안달했고, 대답이라도 받으면 가장 행복한 얼굴을 하기도 했다. 그런 일이 이어지다보니 어른들도 자연스럽게 경계를 풀고 말을 걸기 시작했으나… 그 아이 입에서 내 이름이 나오면 표정이 달라졌지만 그건 잠시뿐이었다.</p><p><br /></p><p>웃는 게 어색하지 않는 사람.</p><p>사랑을 많이 받으며 자란 티가 나는 사람.</p><p>사랑을 베풀줄 아는 사람.</p><p><br /></p><p>낮선 이방인이었지만, 이 마을에서는 있는 것만으로도 모두를 행복하게 하는 그런 사람.</p><p>그게 녀석이었다.</p><p><br /></p><p>생각을 하다 보니 기분이 나빠졌다.</p><p>창 너머 모래 판 위에 세 아이들이 모여있는 게 보였다.</p><p>밀색 머리</p><p>갈색 머리</p><p>그리고 이 마을에서 이질적인 푸른색</p><p>창문을 가릴 수 있다면 좋겠지만 그럴 수가 없어 안 보이게 멀어지는 게 최선이었다.</p><p>창문은 열 수 없게 되어있어 목소리가 작게 들리는 게 다행이었다.</p><p><br /></p><p>갑자기 찾아온 레이를 쫒아내기는 했어도, 방 안에서 할 수 있는 건 없었다.</p><p>결국, 가아라는 그들이 있는 곳을 피해서 건물 밖으로 나왔다.</p><div><hr class="hr hr-solid-bold"></div><p>해가 지기 전에 우리는 방에 들어왔다.</p><p>손에 묻은 흙을 털고 마른 천으로 닦아냈다.</p><p>저녁 시간까지는 더 시간이 있을 것으로 생각해 바로 방으로 가려 했는데. 안이 왜인지 분주했다.</p><p>모래 마을의 장로들이 바쁘게 어디론 가로 가고 있었다.</p><p>무슨 일이지? 복도를 지나가는 사람 중에서 얼굴이 익숙한 사람이 지나가길래 바로 옷자락을 붙잡았다.</p><p>내가 여기 온 지 며칠 되지 않았을 때 적응하도록 도와준 사람이었다.</p><p><br /></p><p>"무슨 일 있어? 왜 회의 날도 아닌데 장로들이 와있어?"</p><p>"그게...."</p><p><br /></p><p>장로들이 마실 거리를(라고 해봤자 물이지만) 가지고 가던 모양이었는지 쟁반 위에 컵들이 올려져 있었다.</p><p>조금 고민하다가 들은 이야기는 이랬다.</p><p>얼핏 듣기로는 가아라가 밖에 나갔다가 사람이 한 명 죽었다는 것이었다.</p><p><br /></p><p>"레이 님을 데려오라는 말씀은 없으셨는데....."</p><p>"??? 거기서 내가 왜 나와?"</p><p>"네? 그야 레이님은 신이 내린 사람이잖아요."</p><p><br /></p><p>'아니, 아무리 그래도 6살 아이 아니냐??'</p><p>이해가 되지 않았다. 어리둥절한 표정으로 ‘그게 무슨 말이야’라며 아이라는 걸 이야기하니</p><p>그 사람은 ‘신이 내린 사람이잖아요’ 라는 말만 반복했다.</p><p>그렇게 의미 없는 실랑이만 하다가 지금 바로 가봐야한다는 말을 하고서 뽀르르 가 버렸다.</p><p><br /></p><p>하...... 인생....왜 이러냐......</p><p>일단 내 숙제나 하고 있자 생각했다. 회의라 오래 걸릴 테고. 설마 진짜 6살 짜리를... 아니 그 전에 난 똑똑한 편이 아니라 고민해봤자 시간만 낭비하는 사람이기 때문이었다.</p><div><hr class="hr hr-solid"></div><p>설마가 사람 잡는 다더니… 절대 그런 일 없을거라 생각했던 게 실제로 일어나고 말았다.</p><p>내가 왜 여깄는가 생각을 했다.</p><p>난 분명 방안에서 숙제인 한자쓰기를 하고 있었는데 말이지.</p><p>왜 회의실 안에 있지? 그것도 카제카게와 장로들이 있는 회의에?</p><p><br /></p><p>나는 주위를 쭉 둘러보며 사람들의 얼굴을 훑어 보았다.</p><p>이 사람들이 마을 하나를 이끌어간다니... 게다가 이 세계에서 다섯 대국의 다섯 닌자 마을을 다스리는 오카게는 그냥 마을을 이끄는 사람이 아니라 그보다 더 높은 사람으로 본다.</p><p>밑에는 장로들과 상급 닌자들이 있고 회의를 통해서 그나마 민주적으로<span style="color:rgb(112,112,112);">--내 눈엔 아직 멀었지만, 역사상 이전과 비교하자면--</span>이끄는 듯한데 중요한 회의에 어린애? 그것도 6살 아이를? 왜?? 이 사람들 제정신인가 의심이 들기 시작한다.</p><p><br /></p><p>"그래서 레이씨"</p><p>"네?"</p><p>"당신의 의견을 묻고 싶습니다."</p><p><br /></p><p>나이 지긋한 분이 나에게 높임말을 쓰면서 묻는 저것의 뜻을 내가 들은 것들에 내 눈치와 감을 더해서 이해하자면</p><p>'가아라가 공격한 비슷한 나이대의 아이가 있는데 가아라가 그 아이를 공격했다는 것이며 이런 경우가 한두 번이 아니라며 피해자도 피해자의 부모도 엄벌을 부탁한다.'</p><p>라고 하는데 이걸 해결 좀 해보라는 거였다.</p><p><br /></p><p>솔직히 '피해자가 가아라한테 뭔가를 해서 그런 거겠지.'라는 생각이 먼저 들어서, 그냥 무시해달라고 하고 싶었다.</p><p>내가 알기로는 가아라는 먼저 시비를…..아니다 중급 닌자 시험에서 먼저 시비를 걸기는 했구나…….</p><p>하지만 그렇다고 먼저 공격하지는 않는걸로 알고 있으니까.</p><p><br /></p><p>게다가 난 모래 마을 장로들이나 마을 사람들은 그다지 좋게 안 본다. </p><p>예의를 지키고 웃으면서 최대한 상냥하게 대답하는거야 일단 나한테는 무언가 해를 끼친게 없는데다가, 내가 이 마을에 빌붙어 사는 것도 있으니까 그런거다.</p><p>싫어하는 이유야 많다. 장로들은 애한테 암살자 보낸 게 몇 번(?)인지 말하기 입 아프고....</p><p>본편에서 나온 이야기 중에 가아라가 약을 마을 아이에게 직접 가져다주는 이야기가 있었다.</p><p>물론 가아라는 그 아이들을 거의 죽일 뻔했지만, 중간에 야샤마루가 막아선 덕분에 아이들은 생명에 지장 없을 정도로 상처만 입고 말았지만, 가아라는 직접 아이들에게 바르는 연고를 가져다주기로 하고 연고를 받아다가 현관문 앞에서 건네주려 하는데.....</p><p>하 더는 나도 슬프다. 그걸 본 게 내가 14살 때였는데도 엄청 충격이었지.</p><p><br /></p><p>‘'저리꺼져 이 괴물!' 이라니!! '괴물'이라니!!! 아니 약 가져온 애한테 그게 할 말이냐고!!!! 그리고 정말 사과도 했다. 이전에 야샤마루가 마음의 상처에 관한 이야기를 하고 그게 미안해서 진심으로 했다고!!! 아니!!야 우리 엄마 아빠였으면 엉? 고맙다 하고 약은 가져오라고 했을 거였어 엉??? 세상에 누가 약을 그냥 주냐고!!!’</p><p><br /></p><p>게다가 그때 가아라도 아무 이유 없이 공격한 것도 아니다.  6살 아이에게 어른도 하기 힘든 미수 중 하나인 수학을 제어 하라는 것도 말도 안 되는데, 아이가 심적으로 힘들어질 때면 힘이 과하게 나와버려서 문제였다.</p><p>그때는 절벽에 잘 못 올라간 공을 내려줬더니 가아라 보고 무섭다고 도망쳤지.</p><p><br /></p><p>'생각해보니 예의가 없네, 그냥 고맙다고 하고 공 가져가면 될 걸 가지고....'</p><p><br /></p><p>그리고 이 장로들은 신이 내렸다는 이야기 하나 가지고<span style="color:rgb(112,112,112);">(솔직히 이걸 왜 믿고있는지 의문이다.)</span> 내가 팔방미인인 줄 아나 보다 나는 할 줄 아는 거 하나도 없거든요? 토론도 해본 적 없거든요? 소시민으로 살았거든요? 할 줄 아는 거라곤 근거 없이 큰소리 치는 것 밖에 없거든요?</p><p><br /></p><p>"하....."</p><p>"역시 아직 어린애라...."</p><p><br /></p><p>내 침묵을 뭐라고 해석했는지 장로들이 수군거린다. 현재 카제카게인 라사도 무표정으로 입을 닫고 있다</p><p>나를 빤히 보면서.... 뭔가 기분이 나빠서 못 참고 이야기를 꺼내버렸다.</p><p>속으로는 이정도면 나에게 해를 준거라고 자기합리화를 하면서</p><p><br /></p><p>"어쩐 일로 상식적인 이야기를 다 하시나요? 6살 아이에게 회의에 참석하라고 명령조로 할 때만 하더라도 그런 이야기는 하나도 모르는 줄 알았는데"</p><p><br /></p><p>화를 참기 위해 최대한 웃으면서 한 말에 정적이 찾아왔다.</p><p>방금까지 실컷 수근대던 모두가 말을 멈췄다.</p><p>나는 지금 화나서 그런거 신경쓸 때가 아니었다. 이 정도는 정당방위로 봐주겠지. 의견이 없는 것도 아니니까.</p><p>나는 다시 말을 꺼냈다.</p><p><br /></p><p>"일단은 여기서 그 사건이 일어나기 전, 일어나는 중, 일어난 후 모두 보신 분 손 들어보시겠어요?”</p><p><br /></p><p>아무도 손을 들지 않는다.</p><p>서로 눈치만 살피고 있을 뿐.</p><p><br /></p><p>"아무도 없어요?"</p><p>"......"</p><p><br /></p><p>대답이 없다. 팔을 올린 사람도 없다. 이런 상태라니 어처구니가 없었다.</p><p><br /></p><p>"이런 상태에서 뭘 결정해요. 애초에 그 말을 한 사람 피해자랑 친하거나 가족 아니에요? 그럼 중간에 뭔가를 숨기지 않았는지 한쪽의 편을 드는게 아닌지 확인을 못하잖아요?"</p><p><br /></p><p>난 회의 전 짚고 넘어가야 할 점을 이야기했다.</p><p>이전 생에서 오빠가 이야기해준 건데 이렇게 써먹게 될 줄은 몰랐다.</p><p>물론 사회 생활 할 때는 직접 본 게 아닌 이상 소문에 휘둘리지 말라고 해준 거에 가깝지만, 어쩌겠는가 배운 내가 이렇게 쓰겠다는데</p><p><br /></p><p>"언제, 어디서, 누가, 왜, 그런 일을 해서 사건이 발생했고, 그래서 사건에 연루된 사람은 각각 어떤 피해를 보았는지 확인을 해야죠. 그리고 사건의 발생 이전, 도중과 이후 이야기는 피해자와도 가해자와도 친하지 않은 제 삼 자여야 하며 직접 사건을 봤거나 자세히 전달받았어야 합니다. 그것도 구체적이고 누구의 시선에도 치우쳐지지 않는 형식으로요."</p><p>"하지만 이 사건은...."</p><p>"피해자와 그 부모가 엄벌해 달라고 해도 앞뒤 사정은 알고 이야기를 해야죠. 그래서 피해자의 피해 상황과의 인과응보를 봐서 어떤 벌을 받게 할지 정해서 다수의 사람들이 이해하게 만들어야 할 것 아니에요? 그리고 제가 알기로는 가아라는 인주력이기 때문에 이런 일이 처음은 아닌 거로 아는데요? 그 때는 어떻게 했어요?"</p><p>"그때는...."</p><p><br /></p><p>다들 말을 하지 않고 서로 눈치만 보고 있다.</p><p>이야기 할 수 없는 것 같았다. 그럴거면 나를 왜 이 자리에 앉혀놓은거야?</p><p>너무 화가 나서 이 이야기를 안 할 수가 없다. 이 상황에 맞는 이야기는 아니지만 그냥 지르기로 했다.</p><p><br /></p><p>"....제가 여기 오기 전 봤던 걸 이야기 해 드릴게요. 해당 사건에 대한 여러분들의 판단이 뭐였는지 알려주시면 좋을 것 같습니다. 이 마을에서 일어난 일이라 여러분들도 아실 겁니다."</p><p><br /></p><p>카제카게를 제외한 모두가 긴장하는 게 보였다.</p><p>어깨는 올라가 있고 팔이 일자로 굳어있었다.</p><p><br /></p><p>"말하기 전에 지금부터 여러분들에게 말할 이야기는 회의실 밖에서는 말씀 안하시는게 좋을 겁니다. 정신병자나 미친놈 취급 당할 수도 있으니까요. "</p><p><br /></p><p>나는 지금 미친놈 취급당할 수 있지만 뭐... 상관없지</p><p><br /></p><p>"더불어서 제가 말한 것들은 아무리 말도 안 되어도 전부 진실임을 알려드립니다. 바라시면 뭐 목숨 걸고 선서라도 하죠. 거짓을 말하면 죽는 저주에 걸리라면 걸리겠습니다."</p><p><br /></p><p>그런 저주를 할 수 있을리 없지만, 지금 내 심정으로는 제발 걸어줬으면 좋겠다.</p><p>그 정도로 나는 자신 있었다.</p><p><br /></p><p>"그럼 이야기하죠."</p><p><br /></p><p>내가 한 이야기는 이전에 가아라가 폭주했던 사건이었다. 그때의 상황은 처참했다. 어린 아이인 칸쿠로가 돌아다니면서 대피소로 가라. 건물 안엔 들어가지 말라 외치고 다녔으니까. 그 정도로 아비규환이었다는 것이다. 정신을 제대로 차린 게 그 아이 하나였다는 거였으니....</p><p><br /></p><p>"저는 그 사건의 책임을 카제카게님께 지라고 할 겁니다."</p><p><br /></p><p>장로들도 라사도 놀란 것 같았지다.</p><p>장로 하나가 놀라면서 이야기 했다.</p><p><br /></p><p>“그게 대체 무슨 이야기 입니까?! 그걸 복구한다고 카제카게님께서 얼마나 노력하셨는지 모르면서 함부로 이야기 하시면 안 됩니다!!”</p><p><br /></p><p>어이가 없었다.</p><p>어쩌다가 폭주했는지도 모르면서 가아라에게 괴물이라고 막말했던 사람이 하는 이야기가 저런 정상적인거라니…</p><p>나는 어이없다는 감정을 숨기지 않고 그 장로에게 물었다.</p><p><br /></p><p>"가아라는 왜 폭주했을까요?”</p><p>“그야, 불안정하기 때문에…”</p><p>“틀렸습니다.”</p><p><br /></p><p>그리고 누구도 반박할 수 없게 말을 이었다.</p><p>내가 할 수 있는 한 빠르게…</p><p><br /></p><p>“제가 알기로는 그 전까지는 폭주한다 해도 마을 단위가 아니라 사람 한 명이 어떻게 되는 선에서 끝났었어요. 게다가 이전과 다른게 그 폭주는 수학도 나오지 않았나요?"</p><p><br /></p><p>정신은 가아라가 잠이 들기 전까지는 나오지 못하니 몸체만 나왔었고 가아라의 상체는 매달려서 대롱거렸을 것이다.</p><p><br /></p><p>"칸쿠로님은 그걸 보고 힘들어서 며칠 동안 식사도 못 했다고 하던데요?"</p><p><br /></p><p>실제로 밥을 먹으려다가도 가아라를 보면 헛구역질을 했던 영상이 있었다.</p><p>이해는 하지만, 그래도 자기 남동생인데 그렇게 대놓고…..후….. 일단 심호흡을 해서 감정을 살짝 가라 앉혔다.</p><p>너무 흥분하면 안된다.</p><p><br /></p><p>"...이어서 말하자면, 제가 그렇게 이야기한 이유는 그 사건이 왜 일어났는지 알고 있으니까 그런 겁니다. 그 사건으로 가아라의 이마에 한자가 하나 붙였죠? '사랑'이라는 한자가."</p><p><br /></p><p>그러고 보니 상처가 그렇게 붉은색으로 남을 정도였으면... 얼마나 깊게 판 건지.....</p><p>그 정도로 야샤마루에게 들은 이야기의 충격이 컸던 거겠지….</p><p>가아라에게 야샤마루는 사랑 받을 수 있는 유일한 존재였으니까.</p><p><br /></p><p>"그 일 이전의 이야기는 이렇습니다. 모래 마을의 암부 야샤마루가 가아라를 지키고 돌보는 보모생활을 하고 있었을 겁니다. 그러던 어느 날 가아라는 아이들을 다치게 합니다. 다행이었죠 야샤마루가 막았으니 다친 걸로 끝났으니까. 그게 미안했는지 가아라는 약을 주려고 갔다가 괴물이란 소리나 듣고 그냥 집에 오게 됩니다."</p><p><br /></p><p>물론 오다가 또 애를 아주 귀신 보듯 한 취객을 하나 죽이긴 했지만.</p><p>그건 일부러 이야기 하지 않았다. 좋을게 없으니까.</p><p>솔직히 그 약에 관련된 것도 자세히 끄집어 내고 싶었지만, 그랬다가는 이 이야기를 하지 못할 수도 있다.</p><p><br /></p><p>"그런 가아라의 뒤쪽에서 암살자가 나타났습니다.”</p><p><br /></p><p>다들 술렁인다.</p><p>그렇겠지, 카제카게의 자택에 외부에서 온 암살자가 카제카게의 아이들의 지척까지 왔는데도 누구도 알아채지 못했었다는 이야기로 들릴 수도 있으니까.</p><p>나는 계속 이야기 했다.</p><p><br /></p><p>"가아라는 절대 방어도 있고 감정이 격해져 있었기에 암살자는 금방 제압되었습니다. 하지만 그 암살자의 정체는 자신을 돌봐주던 야샤마루였던 것이죠. 그럼 야샤마루는 왜 암살자를 했는가? 그걸 명령한 사람은 누구인가. 추측되지 않나요?"</p><p><br /></p><p>장로 아니면 카제카게정도의 지위가 아니면 암부에게 누가 명령하겠는가.</p><p>내가 그때 한국에 있던 팬카페에서 투표를 하나 올렸었다. 가아라를 가장 괴롭게 한 사람은 누구인가?</p><p>야샤마루가 50퍼센트로 압도적 1위였다. 라사도, 모래 마을 사람들도 투표에 올렸지만, 압도적으로 1위였다. 그 과거만 보면 그랬다. 나도 그렇게 생각했으니까 근데 알고 보니 그건 그가 바랬던 임무가 아니었다.</p><p>소년기에서 그는 자신이 거부했다면 할 수 있었다 했지만 아니었다. 라사는 야샤마루가 절대로 거절 할 수 없게 가아라의 목숨줄로 협박을 했으니까. 물론 마을 사람들은 대피시켜놓았다고 라사는 거짓말도 함께였다.</p><p>하다못해 마을 사람들을 대피시켰다고 거짓말이라도 하지 않았다면, 그걸 이유로 야샤마루는 거절할 것이었다.</p><p><br /></p><p>"야샤마루가 그 임무를 맡게 된 건 라사...아니 카제카게님이 이번에 가아라가 폭주하지 않으면 가아라의 폐기를 뒤로 미루겠다고 했기 때문입니다. 혹시나 가아라가 폭주한다고 해도 안심하라는 마을 사람들 모두를 대피시켰다는 거짓말과 함께요."</p><p>"....................................................."</p><p><br /></p><p>아무도 말을 하지 않는다. 직접적으로 언급된 당사자인 라사조차도 표정이 무척이나 평온하다.</p><p>그게 신경쓰였지만, 하고 싶은 말을 계속 했다.</p><p><br /></p><p>"전 이 모든 일련의 과정을 봤었습니다. 그 때문에 그때의 폭주 사건은 가아라가 아니라 현 카제카게인 라사에게 책임을 물을 겁니다. 물론 이 사건은 이미 마을 내에서 일단락된 걸로 알기 때문에 더 긁어 부스럼 만들진 않겠습니다. 제가 묻고 싶은 건 앞뒤 사정을 모두 본 사람이 그 누구의 시선으로도 치우치지 않게 이야기해서 낸 제 결정에 의의 있으신 분 계십니까?"</p><p><br /></p><p>있을 리가 없다. 그래 의의가 있다는 건 두 가지 의미를 지니니까.</p><p><br /></p><p>1. 나는 마을 사람들이 어떻게 되던 가아라를 시험하는게 먼저라고 생각한다.</p><p>2. 그 일이 실제로 있었던 사건이 맞다는 확실한 인정</p><p><br /></p><p>그걸 보고서 난 웃으면서 이야기했다.</p><p>원래부터 이 이야기를 하기 위해 한 말인 것 처럼</p><p><br /></p><p>"이렇듯 제 삼 자의 시선으로 객관적으로 앞뒤 사정도 아는 게 판결에 군소리도 없어지고 공평한 결론을 내릴 수 있습니다. 하지만 지금 여러분이 말씀하신 사건은 이 중 아무것도 없으니, 제가 말씀드릴 건 없군요. 자, 그럼 전 제 의견 다 이야기했으니 이만 가보도록 하겠습니다. 허락해 주시겠습니까?"</p><p><br /></p><p>그렇게 난 금방 방으로 돌아갈 수 있었다. 회의실에 들어간 지 2시간이나 지난 후였다.</p>
