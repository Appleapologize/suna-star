<link rel="stylesheet" href="/suna-star/skin/css/style.css">
<link rel="stylesheet" href="/suna-star/skin/css/guest.css"> 
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer">

<div id="guest">
  <div class="text-module module">

      <h1>방명록</h1>

    <form id="guest-form">
      
      <!-- 방명록 작성자명, 비밀번호 입력란 -->
      <div>
      <div class="guest-list-name">
        <input type="text" id="guest-name" placeholder="이름을 입력해주세요"/>
        <input type="password" id="guest-password" placeholder="비밀번호를 입력해주세요">
      </div>     
      <!-- 방명록 전송 버튼 -->
        <button type="button" id="guest-submit">Send</button>  
      </div>
      <!-- 방명록 내용 입력란 -->
      <div class="guest-list-content">
        <textarea id="guest-content" placeholder="내용을 입력해주세요"></textarea>
      </div>
    </form>
</div>
          <div class="guest-li text-module module noti">
          <div class="guest-nm-date">
            <div class="guest-list-name">Suna-Star <span class="notice">주의</span></div>
            <div class="guest-list-created-at">2024년 12월 24일 오후 02:02</div>
          </div>
          <div class="guest-list-content">비공개 기능은 구현되어있지 않습니다.
          </div>
    <hr class="comment-form">
      <div class="comment">
        <li>
          <div class="guest-nm-date">
            <div class="guest-list-name">Suna-Star</div>
            <div class="guest-list-created-at">2025년 01월 06일 오전 11:49</div>
          </div>
          <div class="guest-list-content">참고로 댓글은 이렇게 작성됩니다.</div>
        </li>
       </div>  
        </div>
      <div id="guest-list" ></div> 

<script type="module">
// Firebase 초기화
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-analytics.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  //삭제 기능 추가
  doc, 
  deleteDoc,
} from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyAvLCnV2Vnb55JdCnz8T3XGwfK436HKZ7o",
  authDomain: "suna-star-guest.firebaseapp.com",
  projectId: "suna-star-guest",
  storageBucket: "suna-star-guest.firebasestorage.app",
  messagingSenderId: "905123913657",
  appId: "1:905123913657:web:55244f54e7c0cdca7aa068",
  measurementId: "G-L9EPK8DD0L",
};

// Firebase 초기화
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);

// guests 컬렉션 참조
const guestRef = collection(db, "guests");

// 최신순 정렬
const q = query(guestRef, orderBy("created_at", "desc"));

  // 📅 방명록과 댓글의 날짜를 한 번에 제어하는 공용 포맷 함수
function formatMyDate(firebaseDate) {
  if (!firebaseDate) return "";
  const date = new Date(firebaseDate.toDate());
  const year = date.getFullYear().toString().slice(-2); // 연도 뒤 2자리 (예: 26)
  const month = (date.getMonth() + 1).toString().padStart(2, "0");// 월 2자리
  const day = date.getDate().toString().padStart(2, "0"); // 일 2자리
  const ampm = date.getHours() >= 12 ? "오후" : "오전";  // 시 2자리 (12시간제)
  const hours = (date.getHours() % 12 || 12).toString().padStart(2, "0"); // 12시간제 2자리
  // const hours = date.getHours().toString().padStart(2, "0"); 시 2자리 (24시간제, const ampm 1줄은 필요 없음.)
  // 만약 24시간으로 바꾼다면 return `${year}.${month}.${day} ${ampm} ${hours}:${minutes}`; 여기서  ${ampm}은 필요 없으므로
  //return `${year}.${month}.${day} ${hours}:${minutes}`; 이렇게 적으면 된다.
  const minutes = date.getMinutes().toString().padStart(2, "0");// 분 2자리
  return `${year}.${month}.${day} ${ampm}&nbsp;${hours}:${minutes}`;
}



  
// 방명록 작성
async function sendGuest() {
  const nameInput = document.querySelector("#guest-name");
  const contentInput = document.querySelector("#guest-content");
  const passwordInput = document.querySelector("#guest-password");
  const name = nameInput.value.trim();
  const content = contentInput.value.trim();
  const password = passwordInput ? passwordInput.value.trim() : "";

  if (!name || !content || !password) {
    alert("이름, 내용, 비밀번호를 모두 입력해주세요.");
    return;
  }

  try {
    await addDoc(guestRef, {
      name: name,
      content: content,
      password: password,
      created_at: new Date(),
    });

    console.log("방명록 작성 완료");
    nameInput.value = "";
    contentInput.value = "";
    if (passwordInput) passwordInput.value = "";
    await getGuestList();
  } catch (error) {
    console.error("방명록 작성 중 오류 발생:", error);
  }
}

// 댓글 작성
async function sendComment(guestId) {
  const commentNameInput = document.querySelector(`#comment-name-${guestId}`);
  const commentContentInput = document.querySelector(`#comment-content-${guestId}`);
  const commentPasswordInput = document.querySelector(`#comment-password-${guestId}`);
  const name = commentNameInput.value.trim();
  const content = commentContentInput.value.trim();
  const password = commentPasswordInput ? commentPasswordInput.value.trim() : "";

  if (!name || !content || !password) {
    alert("댓글 작성자의 이름과 내용, 비밀번호를 모두 입력해주세요.");
    return;
  }

  try {
    const commentRef = collection(db, `guests/${guestId}/comments`);
    await addDoc(commentRef, {
      name: name,
      content: content,
      password: password,
      created_at: new Date(),
    });

    console.log("댓글 작성 완료");
    commentNameInput.value = "";
    commentContentInput.value = "";
    await getComments(guestId);
  } catch (error) {
    console.error("댓글 작성 중 오류 발생:", error);
  }
}

// 댓글 불러오기
async function getComments(guestId) {
  try {
    const commentRef = collection(db, `guests/${guestId}/comments`);
    const commentQuery = query(commentRef, orderBy("created_at", "asc")); // "desc" 로 바꾸면 최신순 (위로 갈수록 최신 글), "asc"는 옛날 순(위로갈수록 과거 글)
    const commentList = await getDocs(commentQuery);

    let html = `<ul>`;
    commentList.forEach((doc) => {
      const commentId = doc.id;
      const data = doc.data();
      const myDate = formatMyDate(data.created_at);

      html += `
      <div class="comment">
        <li>
          <div class="guest-nm-date">
            <div class="guest-list-name">${data.name}</div>
            <div class="guest-list-created-at">${myDate}</div>
            <button class="delete-comment-btn" data-guest-id="${guestId}" data-comment-id="${commentId}" data-password="${data.password || ''}">삭제</button>
          </div>
          <div class="guest-list-content">${data.content}</div>
        </li>
      </div> 
      `;
    });
    html += `</ul>`;

    document.querySelector(`#comments-${guestId}`).innerHTML = html;
  } catch (error) {
    console.error("댓글 불러오기 중 오류 발생:", error);
  }
}

// 댓글 입력 폼 생성
function createCommentForm(guestId) {
  return `
  <hr class="comment-form">  
  <div class="comment-toggle">
    <button class="toggle-comment-form" data-guest-id="${guestId}"><i class="fa-solid fa-comment-dots"></i></button>
    <div class="comment-form" id="comment-form-${guestId}" style="display: none;">
    <div>
       <div class="guest-list-name">
        <input type="text" id="comment-name-${guestId}" placeholder="이름을 입력해주세요">
        <input type="password" id="comment-password-${guestId}" placeholder="비밀번호를 입력해주세요">
       </div>
      <button id="comment-submit-${guestId}">Send</button>
      </div>      
      <textarea id="comment-content-${guestId}" placeholder="내용을 입력해주세요"></textarea>
    </div>

    <div id="comments-${guestId}" class="comments-list"></div>
  </div>
  `;
}

// 방명록 불러오기
async function getGuestList() {
  try {
    let html = ``;
    const guestList = await getDocs(q);

    guestList.forEach((doc) => {
      const guestId = doc.id;
      const data = doc.data();
      const myDate = formatMyDate(data.created_at);

      html += `
        <div class="guest-li text-module module">
          <div class="guest-nm-date">
            <div class="guest-list-name">${data.name}</div>
            <div class="guest-list-created-at">${myDate}</div>
            <button class="delete-guest-btn" data-guest-id="${guestId}" data-password="${data.password || ''}">삭제</button>
          </div>
          <div class="guest-list-content">${data.content}</div>
          ${createCommentForm(guestId)}
        </div>
      `;

      getComments(guestId);
    });

    document.querySelector("#guest-list").innerHTML = html;
  } catch (error) {
    console.error("방명록 목록 불러오기 중 오류 발생:", error);
  }
}


// 💥 6. 실제 삭제를 처리하는 핵심 함수들 (새로 추가)
// [A] 방명록 메인 글 삭제
async function deleteGuest(guestId, originalPassword) {
  if (originalPassword) {
    const inputPw = prompt("방명록 삭제 비밀번호를 입력해주세요.");
    if (inputPw === null) return;
    if (inputPw !== originalPassword) return alert("비밀번호가 틀렸습니다.");
  } else {
    if (!confirm("비밀번호가 없는 이전 글입니다. 삭제할까요?")) return;
  }

  try {
    await deleteDoc(doc(db, "guests", guestId));
    alert("방명록이 삭제되었습니다.");
    await getGuestList();
  } catch (error) {
    console.error("삭제 실패:", error);
  }
}

// [B] 대댓글 삭제
async function deleteComment(guestId, commentId, originalPassword) {
  if (originalPassword) {
    const inputPw = prompt("댓글 삭제 비밀번호를 입력해주세요.");
    if (inputPw === null) return;
    if (inputPw !== originalPassword) return alert("비밀번호가 틀렸습니다.");
  } else {
    if (!confirm("비밀번호가 없는 댓글입니다. 삭제할까요?")) return;
  }

  try {
    await deleteDoc(doc(db, `guests/${guestId}/comments`, commentId));
    alert("댓글이 삭제되었습니다.");
    await getComments(guestId);
  } catch (error) {
    console.error("댓글 삭제 실패:", error);
  }
}  
  

// 댓글 입력 폼 토글 이벤트 처리
document.addEventListener("click", (event) => {
  // A. 댓글 입력창 토글 (아이콘 클릭 시 부모 버튼을 찾아내도록 버그 수정)
  const toggleBtn = event.target.closest(".toggle-comment-form");
  if (toggleBtn) {
    const guestId = toggleBtn.dataset.guestId;
    const commentForm = document.querySelector(`#comment-form-${guestId}`);
    if (commentForm) {
      commentForm.style.display = commentForm.style.display === "none" ? "block" : "none";
    }
    return;
  }

  // B. 댓글 등록 버튼 클릭 감지
  if (event.target && event.target.id.startsWith("comment-submit-")) {
    const guestId = event.target.id.replace("comment-submit-", "");
    sendComment(guestId);
    return;
  }

  // C. 메인 방명록 작성 버튼 클릭 감지
  if (event.target && event.target.id === "guest-submit") {
    sendGuest();
    return;
  }
  // D. ✨ [추가] 메인 방명록 삭제 버튼 클릭 감지
  if (event.target && event.target.classList.contains("delete-guest-btn")) {
    const guestId = event.target.dataset.guestId;
    const password = event.target.dataset.password;
    deleteGuest(guestId, password);
    return;
  }

  // E. ✨ [추가] 대댓글 삭제 버튼 클릭 감지
  if (event.target && event.target.classList.contains("delete-comment-btn")) {
    const guestId = event.target.dataset.guestId;
    const commentId = event.target.dataset.commentId;
    const password = event.target.dataset.password;
    deleteComment(guestId, commentId, password);
    return;
  }
});

// 페이지 로드 시 방명록 불러오기
getGuestList();
</script>

</div>
