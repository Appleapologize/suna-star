<link rel="stylesheet" href="/suna-star/skin/css/style.css">
<link rel="stylesheet" href="/suna-star/skin/css/links.css">
<link rel="stylesheet" href="/suna-star/skin/css/custom.css">


<div id="links">

  <div class="banner-module self module">
        <div class="banner-img"><img src="/suna-star/data/suna-star banner.png" style="max-width:200px" id="myBanner" alt="사막의_별이_가장_밝게_빛나는_법이지"></div>
        <div class="banner-text">
            <p>자유롭게 복사해보세요.</p>
            <button class="copy" onclick="copy('img');">배너 이미지 주소만 복사</button>
            <button class="copy" onclick="copy('url');">현재 사이트 주소만 복사</button>
            <button class="copy" onclick="copy('tag');">배너 태그 전체 복사</button>
            <script>
                function copy(type) {
                    let copyUrl = '';
                    let imgSrc = document.getElementById('myBanner').src;
                    let domain = window.location.protocol+'//'+window.location.hostname;
                    let siteTitle = top.document.title;
                    let bannerTag = '<a href="'+domain+'" target="_blank"><img src="'+imgSrc+'" alt="'+siteTitle+'" style="width:100%; height:auto;"></a>';

                    if(type == 'img') {
                        copyUrl = imgSrc;
                    } else if (type == 'url') {
                        copyUrl = domain;
                    } else {
                        copyUrl = bannerTag;
                    }

                    window.navigator.clipboard.writeText(copyUrl).then(() => {
                        alert("클립보드에 복사되었습니다. 원하는 곳에 붙여넣기 하세요.");
                    });
                }
            </script>
        </div>
    </div>
    <div class="banner-module module friend-banner"> 
    </div>

<script>
    // links.html이 #container에 들어가서 브라우저에 그려지는 순간, 
    // 이미 정의되어 있는 loadFriendBanner 함수를 강제로 깨워서 실행시킵니다.
    if (typeof loadFriendBanner === 'function') {
        loadFriendBanner();
    }
</script>
